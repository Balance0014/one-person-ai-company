<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="860" height="520" role="img" aria-label="组织架构：你在最上面；下面是总部；三位负责人；每位负责人管自己的项目。你和总部之间是你拍板的事和只走一个出口的坏消息；产品上的事你和负责人直接对接；总部通过派活账给负责人派活，能直接读每个项目的真实记录，但从不直接给项目下命令。">
