<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="860" height="520" role="img" aria-label="Org chart: you at the top; head office below you; three leads; each lead runs its own workstreams. You and head office exchange your decisions and bad news through one exit. You and each lead talk directly about product decisions. Head office sends tasks to leads via the ledger and reads every workstream's real records without giving them orders.">
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
