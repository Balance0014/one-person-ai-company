<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" role="img" aria-label="会话 A 每做完一个关键步骤就写交接记录，之后上下文被清空。新会话 B 只读仓库就能说出下一步。记录不能比最新提交晚 15 分钟以上。">
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff8182"/></marker>
  <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#f6f8fa"/><line x1="0" y1="0" x2="0" y2="6" stroke="#d0d7de" stroke-width="3"/></pattern>
  <style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', Helvetica, Arial, sans-serif;fill:#1f2328} .s{font-size:13px;fill:#57606a} .b{font-size:15px;font-weight:600} .t{font-size:14px} .l{font-size:12.5px;fill:#57606a} .h{stroke:#ffffff;stroke-width:5px;stroke-linejoin:round;paint-order:stroke} .e{stroke:#57606a;stroke-width:1.6;fill:none} .d{stroke:#8c959f;stroke-width:1.4;fill:none;stroke-dasharray:5 4} .x{stroke:#ff8182;stroke-width:1.6;fill:none;stroke-dasharray:5 4}</style>
</defs>
<rect x="1" y="1" width="858" height="328" rx="16" fill="#ffffff" stroke="#d0d7de"/>
<rect x="30" y="90" width="200" height="100" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.4"/>
<text class="b" x="130" y="125" text-anchor="middle">会话 A</text>
<text class="s" x="130" y="148" text-anchor="middle">每个关键步骤后写</text>
<text class="s" x="130" y="168" text-anchor="middle" style="fill:#cf222e">然后：上下文被清空</text>
<rect x="330" y="40" width="200" height="216" rx="6" fill="#ffffff" stroke="#1f2328" stroke-width="1.4"/>
<text class="b" x="430" y="66" text-anchor="middle">handoff.md</text>
<text class="l" x="348" y="92" text-anchor="start">Updated 2026-10-28 20:42</text>
<text class="t" x="348" y="116" text-anchor="start" style="font-size:12.5px">## 已完成</text>
<text class="t" x="348" y="135" text-anchor="start" style="font-size:12.5px">## 正在做</text>
<text class="t" x="348" y="154" text-anchor="start" style="font-size:12.5px">## 未完成</text>
<text class="t" x="348" y="173" text-anchor="start" style="font-size:12.5px">## 下一步</text>
<text class="t" x="348" y="192" text-anchor="start" style="font-size:12.5px">## 卡在哪</text>
<text class="t" x="348" y="211" text-anchor="start" style="font-size:12.5px">## 代码分支</text>
<text class="t" x="348" y="230" text-anchor="start" style="font-size:12.5px">## 没提交或没推送</text>
<rect x="630" y="90" width="200" height="100" rx="8" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.4"/>
<text class="b" x="730" y="125" text-anchor="middle">新会话 B</text>
<text class="s" x="730" y="148" text-anchor="middle">没有任何聊天记录</text>
<text class="s" x="730" y="168" text-anchor="middle">说得出下一步</text>
<path class="e" d="M230,140 L328,140" marker-end="url(#a)"/>
<text class="l" x="279" y="128" text-anchor="middle">写</text>
<path class="e" d="M530,140 L628,140" marker-end="url(#a)"/>
<text class="l" x="579" y="128" text-anchor="middle">读</text>
<rect x="250" y="274" width="360" height="34" rx="17" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.4"/>
<text class="t" x="430" y="296" text-anchor="middle" style="font-size:13px">记录和最新提交相差不超过 15 分钟</text>
</svg>
