<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" role="img" aria-label="派活账的状态：new，认领并写明计划后 acked，带齐五样证据后 done，或写明理由 rejected。24 小时没认领、过了期限都会被标出来。">
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff8182"/></marker>
  <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#f6f8fa"/><line x1="0" y1="0" x2="0" y2="6" stroke="#d0d7de" stroke-width="3"/></pattern>
  <style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', Helvetica, Arial, sans-serif;fill:#1f2328} .s{font-size:13px;fill:#57606a} .b{font-size:15px;font-weight:600} .t{font-size:14px} .l{font-size:12.5px;fill:#57606a} .h{stroke:#ffffff;stroke-width:5px;stroke-linejoin:round;paint-order:stroke} .e{stroke:#57606a;stroke-width:1.6;fill:none} .d{stroke:#8c959f;stroke-width:1.4;fill:none;stroke-dasharray:5 4} .x{stroke:#ff8182;stroke-width:1.6;fill:none;stroke-dasharray:5 4}</style>
</defs>
<rect x="1" y="1" width="858" height="298" rx="16" fill="#ffffff" stroke="#d0d7de"/>
<rect x="15" y="30" width="210" height="30" rx="15" fill="#ffebe9" stroke="#ff8182" stroke-width="1.4"/>
<text class="t" x="120" y="50" text-anchor="middle" style="font-size:12.5px">24 小时没认领 → 标红</text>
<path class="x" d="M120,60 L120,98" marker-end="url(#r)"/>
<rect x="275" y="30" width="210" height="30" rx="15" fill="#ffebe9" stroke="#ff8182" stroke-width="1.4"/>
<text class="t" x="380" y="50" text-anchor="middle" style="font-size:12.5px">过了期限 → 标红</text>
<path class="x" d="M380,60 L380,98" marker-end="url(#r)"/>
<rect x="40" y="100" width="160" height="64" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.4"/>
<text class="b" x="120" y="128" text-anchor="middle">new</text>
<text class="s" x="120" y="148" text-anchor="middle">记在账上，不在聊天里</text>
<rect x="290" y="100" width="180" height="64" rx="8" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.4"/>
<text class="b" x="380" y="128" text-anchor="middle">acked</text>
<text class="s" x="380" y="148" text-anchor="middle">写明打算怎么做</text>
<rect x="570" y="100" width="250" height="64" rx="8" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.4"/>
<text class="b" x="695" y="128" text-anchor="middle">done</text>
<text class="s" x="695" y="148" text-anchor="middle">五样证据齐全</text>
<rect x="570" y="200" width="250" height="56" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.4" stroke-dasharray="4 3"/>
<text class="b" x="695" y="224" text-anchor="middle">rejected</text>
<text class="s" x="695" y="243" text-anchor="middle">写明理由</text>
<path class="e" d="M200,132 L288,132" marker-end="url(#a)"/>
<path class="e" d="M470,132 L568,132" marker-end="url(#a)"/>
<path class="e" d="M470,150 Q520,150 520,190 Q520,228 568,228" marker-end="url(#a)"/>
<text class="l" x="430" y="285" text-anchor="middle">聊天里可以提账上的某条活，但不能拿聊天代替记账。</text>
</svg>
